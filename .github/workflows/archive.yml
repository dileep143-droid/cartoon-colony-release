name: archive
# Every episode x language: Kaggle 1440p -> music -> Google Drive "Cartoon Colony Episodes/<lang>" (skips files already there). Nothing is kept on GitHub.
on:
  workflow_dispatch:
    inputs:
      eps:   { description: 'JSON list of episodes', required: true, default: '["ep02","ep03","ep04","ep05","ep06","ep07","ep08","ep09","ep10","ep11","ep12"]' }
      langs: { description: 'JSON list of languages', required: true, default: '["hi","te","ta","kn","ml","mr","bn","gu","pa","or","as","en"]' }
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        ep: ${{ fromJSON(inputs.eps) }}
        lang: ${{ fromJSON(inputs.langs) }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q kaggle google-api-python-client google-auth numpy
      - name: archive ${{ matrix.ep }} ${{ matrix.lang }}
        env:
          YT_TOKEN: "{}"
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          KAGGLE_KEY1: ${{ secrets.KAGGLE_KEY1 }}
          KAGGLE_KEY3: ${{ secrets.KAGGLE_KEY3 }}
          KAGGLE_KEY5: ${{ secrets.KAGGLE_KEY5 }}
          KAGGLE_KEY6: ${{ secrets.KAGGLE_KEY6 }}
          KAGGLE_KEY7: ${{ secrets.KAGGLE_KEY7 }}
          KAGGLE_KEY9: ${{ secrets.KAGGLE_KEY9 }}
          KAGGLE_KEY10: ${{ secrets.KAGGLE_KEY10 }}
          KAGGLE_KEY12: ${{ secrets.KAGGLE_KEY12 }}
          KAGGLE_KEY13: ${{ secrets.KAGGLE_KEY13 }}
          KAGGLE_KEY14: ${{ secrets.KAGGLE_KEY14 }}
          KAGGLE_KEY15: ${{ secrets.KAGGLE_KEY15 }}
          KAGGLE_KEY17: ${{ secrets.KAGGLE_KEY17 }}
        run: python release_one.py "${{ matrix.ep }}" "${{ matrix.lang }}" drive ""
