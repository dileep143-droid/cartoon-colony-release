name: pdf-ocr
# 10 Nov owner: PDF OCR on GitHub. Put PDFs in Google Drive "PDF Tools/1 Inbox" -> searchable PDF + Word file in "PDF Tools/2 Done".
# Runs every 30 minutes (GitHub timers can be late) or by hand from the Actions tab. An empty inbox finishes in seconds.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      langs: { description: 'OCR languages, e.g. eng+hin+tel+tam+kan+mal+mar+ben+guj+pan+ori+urd', required: false, default: 'eng+hin+tel' }
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ocrmypdf tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tel tesseract-ocr-tam tesseract-ocr-kan tesseract-ocr-mal tesseract-ocr-mar tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-pan tesseract-ocr-ori tesseract-ocr-urd > /dev/null
          pip install -q google-api-python-client google-auth pdf2docx
      - name: OCR the inbox
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          OCR_LANGS: ${{ inputs.langs }}
        run: python pdf_ocr.py
