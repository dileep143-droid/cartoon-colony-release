name: pdf-ocr
# 10 Nov owner: phone -> Google Drive "PDF Tools/1 Inbox" (PDF or photo) -> GitHub reads the words (OCR) -> "PDF Tools/2 Done" -> edit in Page Bench.
# Checks the inbox every 5 minutes (GitHub timers can be late) or run by hand. An empty inbox stops after the quick check.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      langs: { description: 'OCR languages, e.g. eng+hin+tel+tam+kan+mal+mar+ben+guj+pan+ori+urd', required: false, default: 'eng+hin+tel' }
concurrency: { group: pdf-ocr, cancel-in-progress: false }
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: anything in the inbox?
        id: inbox
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth
          python pdf_ocr.py check
      - name: tools
        if: steps.inbox.outputs.has_work == 'true'
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ocrmypdf tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tel tesseract-ocr-tam tesseract-ocr-kan tesseract-ocr-mal tesseract-ocr-mar tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-pan tesseract-ocr-ori tesseract-ocr-urd > /dev/null
          pip install -q pdf2docx pillow pillow-heif
          # more accurate "best" models (github.com/tesseract-ocr/tessdata_best) for the languages asked; the normal ones stay if a download fails
          T=$(dirname $(find /usr/share/tesseract-ocr -name eng.traineddata | head -1))
          for l in $(echo "${OCR_LANGS:-eng+hin+tel}" | tr '+' ' '); do
            curl -sfL --max-time 120 -o /tmp/$l.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/$l.traineddata && sudo mv /tmp/$l.traineddata $T/$l.traineddata && echo "best model: $l" || echo "kept normal model: $l"
          done
        env:
          OCR_LANGS: ${{ inputs.langs }}
      - name: read the words (OCR)
        if: steps.inbox.outputs.has_work == 'true'
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          OCR_LANGS: ${{ inputs.langs }}
        run: python pdf_ocr.py run
