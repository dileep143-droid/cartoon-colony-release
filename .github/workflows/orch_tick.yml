name: orch-tick
# 19 Nov 2026 owner: the Mahabharatam episode pipeline runs here instead of the laptop. Every 10 minutes one tick moves each queued
# episode one step forward (lip-sync segments -> final join -> Google Drive -> delete its notebooks). State lives in R2; nothing private is printed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: orch-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: pip install -q "kaggle==2.2.5" boto3 google-api-python-client google-auth
      - name: tick
        env:
          TICK_MINUTES: '30'
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          KAGGLE_KEY1: ${{ secrets.KAGGLE_KEY1 }}
          KAGGLE_KEY2: ${{ secrets.KAGGLE_KEY2 }}
          KAGGLE_KEY3: ${{ secrets.KAGGLE_KEY3 }}
          KAGGLE_KEY4: ${{ secrets.KAGGLE_KEY4 }}
          KAGGLE_KEY5: ${{ secrets.KAGGLE_KEY5 }}
          KAGGLE_KEY6: ${{ secrets.KAGGLE_KEY6 }}
          KAGGLE_KEY8: ${{ secrets.KAGGLE_KEY8 }}
          KAGGLE_KEY10: ${{ secrets.KAGGLE_KEY10 }}
          KAGGLE_KEY11: ${{ secrets.KAGGLE_KEY11 }}
          KAGGLE_KEY12: ${{ secrets.KAGGLE_KEY12 }}
          KAGGLE_KEY13: ${{ secrets.KAGGLE_KEY13 }}
          KAGGLE_KEY14: ${{ secrets.KAGGLE_KEY14 }}
          KAGGLE_KEY15: ${{ secrets.KAGGLE_KEY15 }}
          KAGGLE_KEY17: ${{ secrets.KAGGLE_KEY17 }}
          KAGGLE_KEY19: ${{ secrets.KAGGLE_KEY19 }}
          KAGGLE_KEY20: ${{ secrets.KAGGLE_KEY20 }}
          KAGGLE_KEY21: ${{ secrets.KAGGLE_KEY21 }}
        run: python orch_tick.py
