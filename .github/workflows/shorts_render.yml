name: shorts-render

# Dileep Explains: render ONE Short on a GitHub runner (23 Nov 2026 test, CPU only). Same edit as the Kaggle kernel shorts_kernel2.py.
# The job (R2 keys only) is made on the laptop by E:/mb_builds/shorts_v1/job/gh_job.py and lives in R2 <prefix>/jobs/<short>.json.
# The owner's face, voice and clips are only fetched from R2 at run time; the result goes back to R2 <prefix>/<short>/.
# Nothing is uploaded as an artifact and nothing private is printed (this repo and its logs are public).
#   mode full     = alignment + LatentSync 1.5 lip-sync on CPU + assembly
#   mode assemble = face circles + timing from a Kaggle GPU (gh_lipsync_kernel.py) -> assembly only

on:

  workflow_dispatch:

    inputs:

      short:  { description: 'Short name, e.g. korea_age_te', required: true }
      mode:   { description: 'full | assemble', required: false, default: 'full' }
      prefix: { description: 'R2 test prefix under s2work/shorts1/ (must start with gh_)', required: false, default: 'gh_test' }

jobs:

  render:

    runs-on: ubuntu-latest

    timeout-minutes: 355

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: '3.10'

      - name: tools

        env:

          MODE: ${{ inputs.mode }}

        run: |
          T0=$(date +%s)
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-liberation > /dev/null
          pip install -q uv
          uv pip install -q --system boto3 pillow numpy==1.26.4
          if [ "$MODE" = "full" ]; then
            uv pip install -q --system torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
            uv pip install -q --system diffusers==0.32.2 transformers==4.48.0 decord==0.6.0 accelerate==0.26.1 einops==0.7.0 omegaconf==2.3.0 \
              opencv-python==4.9.0.80 mediapipe==0.10.11 python_speech_features==0.6 librosa==0.10.1 scenedetect==0.6.1 ffmpeg-python==0.2.0 \
              imageio==2.31.1 imageio-ffmpeg==0.5.1 lpips==0.1.4 face-alignment==1.4.1 huggingface-hub==0.30.2 kornia==0.8.0 \
              insightface==0.7.3 onnxruntime==1.21.0 DeepCache==0.1.1 uroman soundfile
          fi
          echo "STAGE install: $(( ($(date +%s) - T0) / 60 )) min $(( ($(date +%s) - T0) % 60 )) s"

      - name: render ${{ inputs.short }} (${{ inputs.mode }})

        env:

          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          JOB_PREFIX: ${{ inputs.prefix }}
          SHORT: ${{ inputs.short }}
          MODE: ${{ inputs.mode }}

        run: |
          case "$SHORT" in *[!a-z0-9_]*|'') echo "bad short name"; exit 1;; esac
          case "$MODE" in full|assemble) ;; *) echo "bad mode"; exit 1;; esac
          python shorts_render.py "$SHORT" "$MODE"
