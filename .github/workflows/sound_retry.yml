name: Sound library retry
on:
  workflow_dispatch:
jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python sound_lib.py quota
  retry:
    needs: quota
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # Round 2 (resumable downloads): the 4 that failed in round 1
          - {mode: zenodo, a: "20735877", b: foleyset}
          - {mode: zenodo, a: "1203745", b: urbansound8k}
          - {mode: zenodo, a: "4060432", b: fsd50k}
          - {mode: archive, a: sonniss-gdc-2024-game-audio-bundle-normalized, b: sonniss_gdc_2024}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Retry failed collection
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python sound_lib.py ${{ matrix.mode }} ${{ matrix.a }} "${{ matrix.b }}"
