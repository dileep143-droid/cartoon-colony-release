name: Sound library retry
on:
  workflow_dispatch:
jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python sound_lib.py quota
  retry:
    needs: quota
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # Round 4: Sonniss 2020 (round-1 run had the old Drive code)
          - {mode: archive, a: sonniss-gdc-2020-game-audio-bundle-normalized, b: sonniss_gdc_2020}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Retry failed collection
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python sound_lib.py ${{ matrix.mode }} ${{ matrix.a }} "${{ matrix.b }}"
