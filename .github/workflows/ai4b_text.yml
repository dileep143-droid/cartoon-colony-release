name: AI4Bharat text (IndicVoices, text only -> private Drive)
on:
  workflow_dispatch:
jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {ds: IndicVoices, f: telugu}
          - {ds: IndicVoices, f: hindi}
          - {ds: IndicVoices, f: tamil}
          - {ds: IndicVoices, f: kannada}
          - {ds: IndicVoices, f: malayalam}
          - {ds: IndicVoices, f: bengali}
          - {ds: IndicVoices, f: marathi}
          - {ds: IndicVoices, f: gujarati}
          - {ds: IndicVoices, f: punjabi}
          - {ds: IndicVoices, f: odia}
          - {ds: IndicVoices, f: assamese}
          - {ds: IndicVoices, f: urdu}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyarrow huggingface_hub fsspec google-api-python-client google-auth
      - name: Read text columns and save to private Drive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python ai4b_text.py "${{ matrix.ds }}" "${{ matrix.f }}"
