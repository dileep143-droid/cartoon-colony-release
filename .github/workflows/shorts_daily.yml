name: shorts-daily

# Dileep Explains timer (22 Nov 2026, same design as song-daily): finished Shorts from R2 -> 5 channels (te hi ta en bn), N a day each,
# scheduled at 18:30 IST (2 a day: 12:30 + 18:30). Queue = data/shorts/queue_<lang>.json (laptop: E:/mb_builds/shorts_v1/queue_shorts.py).
# Exact title already on the channel -> skipped (never duplicates). Quota error -> that channel stops for today, next run continues.

on:

  # ---- ON (owner approved 26 Nov 2026): daily 06:45 IST, 5 Shorts a day each on te / hi / en (ta, bn on hold) ----
  schedule:
    - cron: "23 1 * * *"

  workflow_dispatch:

    inputs:

      langs:   { description: 'JSON list of channel codes (default all 5)', required: false, default: '' }
      dry:     { description: '1 = test (no upload, no comment); 0 = REAL uploads', required: false, default: '1' }
      per_day: { description: 'Shorts per channel per day (1 = 18:30 IST, 2 = 12:30 + 18:30)', required: false, default: '1' }
      slots:   { description: 'own IST times, e.g. 12:30,18:30 (empty = normal)', required: false, default: '' }
      days:    { description: 'dry only: show the schedule for this many days', required: false, default: '1' }

jobs:

  daily:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    strategy:

      fail-fast: false

      max-parallel: 5

      matrix:

        lang: ${{ fromJSON(inputs.langs != '' && inputs.langs || '["te","hi","en"]') }}

    steps:

      - uses: actions/checkout@v4

      - name: tools

        run: |
          pip install -q google-api-python-client google-auth boto3
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: daily Shorts ${{ matrix.lang }}

        env:

          GH_TOKEN: ${{ github.token }}
          FX_TE: ${{ secrets.FX_TE }}
          FX_HI: ${{ secrets.FX_HI }}
          FX_TA: ${{ secrets.FX_TA }}
          FX_EN: ${{ secrets.FX_EN }}
          FX_BN: ${{ secrets.FX_BN }}
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          # a timer run (no inputs) uses: real uploads, 5 a day (08:00 12:30 15:30 18:30 21:00 IST), te/hi/en
          DRY: ${{ github.event_name == 'schedule' && '0' || inputs.dry }}
          PER_DAY: ${{ inputs.per_day || '5' }}
          SLOTS: ${{ inputs.slots || '08:00,12:30,15:30,18:30,21:00' }}
          DAYS: ${{ inputs.days }}

        run: |
          case "${{ matrix.lang }}" in te) V=FX_TE;; hi) V=FX_HI;; ta) V=FX_TA;; en) V=FX_EN;; bn) V=FX_BN;; *) echo "unknown channel"; exit 1;; esac
          export YT_TOKEN="${!V}"
          if [ -z "$YT_TOKEN" ]; then echo "RESULT ${{ matrix.lang }} NO_SECRET $V"; exit 0; fi
          unset FX_TE FX_HI FX_TA FX_EN FX_BN
          # 27 Nov: a late timer run must not schedule a 2nd set if today's run already happened (manual or timer)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINCE=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%Y-%m-%dT%H:%M:%SZ)
            N=$(gh run list -R "${{ github.repository }}" -w shorts_daily.yml --created ">=$SINCE" --json databaseId --jq length)
            if [ "$N" -gt 1 ]; then echo "RESULT ${{ matrix.lang }} today's schedule already done - skip"; exit 0; fi
          fi
          python shorts_daily.py "${{ matrix.lang }}"
