name: Sound library (all open sound-effect sets -> private Drive)
on:
  workflow_dispatch:
jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python sound_lib.py quota
  collect:
    needs: quota
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # --- Free for commercial use (CC0 or equivalent) ---
          - {mode: mixkit, a: "", b: ""}
          - {mode: pixabay, a: "", b: ""}
          - {mode: bigsoundbank, a: "", b: ""}
          - {mode: url, a: sfx_kit_cc0, b: "https://codeload.github.com/wyzowl/sfx-kit/zip/refs/heads/main"}
          # Sonniss GDC bundles from archive.org (royalty-free, ~180 GB total)
          - {mode: archive, a: sonniss-gdc-2018-game-audio-bundle-normalized, b: sonniss_gdc_2018}
          - {mode: archive, a: sonniss-gdc-2019-game-audio-bundle-normalized, b: sonniss_gdc_2019}
          - {mode: archive, a: sonniss-gdc-2020-game-audio-bundle-normalized, b: sonniss_gdc_2020}
          - {mode: archive, a: sonniss-gdc-2024-game-audio-bundle-normalized, b: sonniss_gdc_2024}
          - {mode: archive, a: gameaudiogdc-part1through7, b: sonniss_gdc_all}
          # FoleySet (CC BY 4.0, 2.2 GB)
          - {mode: zenodo, a: "20735877", b: foleyset}
          # Indian urban sounds (Mendeley, CC BY 4.0)
          - {mode: mendeley, a: 4553jk9dvz, b: indian_urban_audio}
          # --- Research / reference (CC BY or similar) ---
          - {mode: zenodo, a: "14517916", b: 6ksfx}
          - {mode: zenodo, a: "14286414", b: sfx_variations}
          - {mode: zenodo, a: "3668503", b: knocking_emotions}
          - {mode: zenodo, a: "13862", b: vocalsketch}
          - {mode: zenodo, a: "14722710", b: vocalsound}
          - {mode: zenodo, a: "6967442", b: nonspeech7k}
          - {mode: zenodo, a: "1213793", b: isolated_urban}
          - {mode: zenodo, a: "4687854", b: freesound_oneshot_percussive}
          - {mode: zenodo, a: "10869644", b: dcase2024_task7}
          - {mode: zenodo, a: "4060432", b: fsd50k}
          - {mode: zenodo, a: "4783391", b: clotho}
          - {mode: zenodo, a: "2552860", b: fsdkaggle2018}
          - {mode: zenodo, a: "3685832", b: freesound_loops_4k}
          - {mode: url, a: esc50, b: "https://github.com/karolpiczak/ESC-50/archive/master.zip"}
          # --- Non-commercial ---
          - {mode: zenodo, a: "1203745", b: urbansound8k}
          - {mode: zenodo, a: "2529934", b: fsdnoisy18k}
          # BBC Sound Effects (all 23 categories)
          - {mode: bbc, a: Daily_Life, b: ""}
          - {mode: bbc, a: Footsteps, b: ""}
          - {mode: bbc, a: Animals, b: ""}
          - {mode: bbc, a: Machines, b: ""}
          - {mode: bbc, a: Transport, b: ""}
          - {mode: bbc, a: Crowds, b: ""}
          - {mode: bbc, a: Comedy, b: ""}
          - {mode: bbc, a: Bells, b: ""}
          - {mode: bbc, a: Clocks, b: ""}
          - {mode: bbc, a: Toys, b: ""}
          - {mode: bbc, a: Electronics, b: ""}
          - {mode: bbc, a: Destruction, b: ""}
          - {mode: bbc, a: Birds, b: ""}
          - {mode: bbc, a: Industry, b: ""}
          - {mode: bbc, a: Sport, b: ""}
          - {mode: bbc, a: Events, b: ""}
          - {mode: bbc, a: Applause, b: ""}
          - {mode: bbc, a: Atmosphere, b: ""}
          - {mode: bbc, a: Fire, b: ""}
          - {mode: bbc, a: Medical, b: ""}
          - {mode: bbc, a: Aircraft, b: ""}
          - {mode: bbc, a: Military, b: ""}
          - {mode: bbc, a: Nature, b: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Collect and save to private Drive
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python sound_lib.py ${{ matrix.mode }} ${{ matrix.a }} "${{ matrix.b }}"
