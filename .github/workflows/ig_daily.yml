name: ig-daily

# Dileep Explains -> Instagram Reels (26 Nov 2026), same design as shorts-daily (YouTube).
# Daily timer ON (owner approved 26 Nov 2026): 1 Reel per account at 08:00, 12:30, 15:30, 18:30, 21:00 IST = 5 a day each.

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      langs:   { description: 'JSON list of accounts', required: false, default: '["te","hi","en"]' }
      dry:     { description: '1 = test (no posting); 0 = REAL posting', required: false, default: '1' }
      per_run: { description: 'Reels to post per account in this run', required: false, default: '1' }

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(inputs.langs != '' && inputs.langs || '["te","hi","en"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q boto3
      - name: Instagram ${{ matrix.lang }}
        env:
          IG_TE: ${{ secrets.IG_TE }}
          IG_HI: ${{ secrets.IG_HI }}
          IG_EN: ${{ secrets.IG_EN }}
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          DRY: ${{ github.event_name == 'schedule' && '0' || inputs.dry }}
          PER_RUN: ${{ inputs.per_run || '1' }}
        run: |
          case "${{ matrix.lang }}" in te) V=IG_TE;; hi) V=IG_HI;; en) V=IG_EN;; *) echo "unknown"; exit 1;; esac
          if [ -z "${!V}" ]; then echo "RESULT ${{ matrix.lang }} no token yet (secret $V empty) - skipped"; exit 0; fi
          IG_TOKEN="${!V}" python ig_daily.py ${{ matrix.lang }}
